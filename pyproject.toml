[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bellguitar-parallexpert_jd056"
version = "0.1.0"
description = "为每一项打分并与阈值比较，明确标出通过、边界与不通过三档"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "bellguitar" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://bellguitar.github.io"
Repository = "https://github.com/bellguitar/parallexpert_jd056"
Issues = "https://github.com/bellguitar/parallexpert_jd056/issues"

[project.scripts]
parallexpert_jd056 = "parallexpert_jd056:main"

[tool.setuptools]
py-modules = ["parallexpert_jd056"]
